version: '3.8'

services:
  # 1. Meilisearch 核心服务
  meilisearch:
    image: getmeili/meilisearch:v1.37
    container_name: meilisearch
    restart: always      # 容器挂掉或 Docker 重启时自动重启
    ports:
      - "7700:7700"
    environment:
      - MEILI_ENV=development
    volumes:
      - ./meili_data:/meili_data

  # 2. Meilisearch-UI 可视化管理服务
  meilisearch-ui:
    image: eyeix/meilisearch-ui:latest
    container_name: meilisearch-ui
    ports:
      - "24900:24900"   # 将原来的 <your-port> 替换为了 24900，你可以改成自己想要的，比如 8080:24900
    restart: on-failure:5
    depends_on:
      - meilisearch     # 确保 Meilisearch 先启动

  # 3. MySQL 数据库服务
  mysql:
    image: mysql:latest
    container_name: mysql-db
    ports:
      - "3306:3306"      # 宿主机端口:容器端口
    restart: always      # 容器挂掉或 Docker 重启时自动重启
    environment:
      MYSQL_ROOT_PASSWORD: 123456   # 设置 root 用户密码 (请修改为你自己的强密码)
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql_data:/var/lib/mysql